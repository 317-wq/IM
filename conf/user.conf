# M3 用户服务配置
# 用法：./build/bin/user_server -flagfile=conf/user.conf
# MySQL 密码不写在这里，运行时通过环境变量 IM_MYSQL_PASSWORD 传入

-run_mode=true
-log_dir=./logs/user
-log_level=0

-etcd_host=http://127.0.0.1:2379
-service_base=/im/service
-service_name=user
-instance_id=127.0.0.1:10002
-advertise_host=127.0.0.1:10002
-listen_port=10002
-rpc_threads=4
-file_service=/im/service/file

-mysql_host=127.0.0.1
-mysql_port=3306
-mysql_user=root
-mysql_password=
-mysql_db=im
-mysql_charset=utf8mb4
-mysql_pool=16

-redis_host=127.0.0.1
-redis_port=6379
-redis_db=0
-redis_keep_alive=true
-session_ttl_days=7
