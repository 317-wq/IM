// M6 消息查询接口：历史、最近、搜索。

syntax = "proto3";

package im;

import "base.proto";

option cc_generic_services = true;

message GetHistoryMsgReq {
    string request_id = 1;
    string chat_session_id = 2;
    int64  start_time = 3;   // 秒级时间戳
    int64  end_time = 4;
    optional string user_id = 5;
    optional string session_id = 6;
}
message GetHistoryMsgRsp {
    string request_id = 1;
    bool   success = 2;
    string errmsg = 3;
    repeated MessageInfo messages = 4;
}

message GetRecentMsgReq {
    string request_id = 1;
    string chat_session_id = 2;
    int64  count = 3;
    optional string user_id = 4;
    optional string session_id = 5;
}
message GetRecentMsgRsp {
    string request_id = 1;
    bool   success = 2;
    string errmsg = 3;
    repeated MessageInfo messages = 4;
}

message MsgSearchReq {
    string request_id = 1;
    string chat_session_id = 2;
    string search_key = 3;
    optional string user_id = 4;
    optional string session_id = 5;
}
message MsgSearchRsp {
    string request_id = 1;
    bool   success = 2;
    string errmsg = 3;
    repeated MessageInfo messages = 4;
}

service MessageService {
    rpc GetHistory(GetHistoryMsgReq) returns (GetHistoryMsgRsp);
    rpc GetRecent(GetRecentMsgReq) returns (GetRecentMsgRsp);
    rpc Search(MsgSearchReq) returns (MsgSearchRsp);
}
