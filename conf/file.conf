# M1 文件服务配置
# 用法：./build/bin/file_server -flagfile=conf/file.conf
# 格式：每行一个 -name=value，支持 # 注释

# 运行模式：false-调试（控制台），true-发布（按天写文件）
-run_mode=false
-log_dir=./logs/file
-log_level=0

# 注册中心
-etcd_host=http://127.0.0.1:2379
-service_base=/im/service
-service_name=file
-instance_id=127.0.0.1:10001
-advertise_host=127.0.0.1:10001

# RPC 监听
-listen_port=10001
-rpc_threads=4

# 文件落盘目录
-storage_dir=./data/files
