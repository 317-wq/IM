# M6 消息存储服务配置
# MySQL 密码通过环境变量 IM_MYSQL_PASSWORD 传入

-run_mode=true
-log_dir=./logs/message
-log_level=0

-mysql_host=127.0.0.1
-mysql_port=3306
-mysql_user=root
-mysql_password=
-mysql_db=im
-mysql_charset=utf8mb4
-mysql_pool=16

-mq_user=guest
-mq_password=guest
-mq_host=127.0.0.1:5672
-mq_exchange=im.msg
-mq_queue=im.msg.persist
-mq_routing_key=im.msg.persist

-es_host=http://127.0.0.1:9200
-es_index=im_message
