# M4 好友服务配置
# 用法：./build/bin/friend_server -flagfile=conf/friend.conf
# MySQL 密码通过环境变量 IM_MYSQL_PASSWORD 传入

-run_mode=true
-log_dir=./logs/friend
-log_level=0

-etcd_host=http://127.0.0.1:2379
-service_base=/im/service
-service_name=friend
-instance_id=127.0.0.1:10003
-advertise_host=127.0.0.1:10003
-listen_port=10003
-rpc_threads=4
-user_service=/im/service/user

-mysql_host=127.0.0.1
-mysql_port=3306
-mysql_user=root
-mysql_password=
-mysql_db=im
-mysql_charset=utf8mb4
-mysql_pool=4

-es_host=http://127.0.0.1:9200
-es_index=im_user
