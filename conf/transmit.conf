# M5 消息转发服务配置
# MySQL 密码通过环境变量 IM_MYSQL_PASSWORD 传入

-run_mode=false
-log_dir=./logs/transmit
-log_level=0

-etcd_host=http://127.0.0.1:2379
-service_base=/im/service
-service_name=transmit
-instance_id=127.0.0.1:10004
-advertise_host=127.0.0.1:10004
-listen_port=10004
-rpc_threads=4
-user_service=/im/service/user

-mysql_host=127.0.0.1
-mysql_port=3306
-mysql_user=root
-mysql_password=
-mysql_db=im
-mysql_charset=utf8mb4
-mysql_pool=4

-mq_user=guest
-mq_password=guest
-mq_host=127.0.0.1:5672
-mq_exchange=im.msg
-mq_queue=im.msg.persist
-mq_routing_key=im.msg.persist
