# M0 echo 示例服务配置
#
# 用法：./build/bin/echo_server -flagfile=conf/echo.conf
# 格式：每行一个 -name=value，支持 # 注释

# 运行模式：false-调试（控制台彩色），true-发布（写文件）
-run_mode=false

# 发布模式下的日志目录（调试模式忽略）；每天生成 <log_dir>/YYYY-MM-DD.log
-log_dir=./logs/echo

# 日志等级：0 trace / 1 debug / 2 info / 3 warn / 4 error
-log_level=0

# RPC 监听端口
-port=10000
